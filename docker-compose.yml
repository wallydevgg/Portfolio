services:
  frontend:
    container_name: portfolio_frontend
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run messages:extract && npm run compile && npm run dev -- --host 0.0.0.0 --port 5173"
    restart: always
    ports:
      - "${FRONTEND_PORT:-3030}:5173"
    networks:
      - proxy-network
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  backend:
    container_name: portfolio_backend
    image: portfolio_backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    restart: always
    ports:
      - "127.0.0.1:8003:8000"
    environment:
      - POSTGRES_SERVER=${POSTGRES_SERVER:-shared-db}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-portfolio}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS}
      - SECRET_KEY=${SECRET_KEY}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH:-}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-shared-minio:9000}
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
      - MINIO_PUBLIC_URL=${MINIO_PUBLIC_URL:-http://localhost:9000}
      - MINIO_BUCKET=${MINIO_BUCKET:-portfolio}
    networks:
      - data-network
      - proxy-network
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

networks:
  proxy-network:
    external: true
  data-network:
    external: true
