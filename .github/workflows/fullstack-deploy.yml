name: Full Stack Deploy Portfolio (Front+Back) to VPS

on:
  push:
    branches: ["main"]
    paths-ignore:
      - ".github/workflows/**"
      - "README.md"
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────
  # 1. Limpieza de caches (solo en main)
  # ─────────────────────────────────────────────
  cleanup-cache:
    name: Cleanup GitHub Actions Cache
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Cleanup non-main caches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Listing caches..."
          gh api "repos/${{ github.repository }}/actions/caches" --paginate \
            --jq '.actions_caches[] | [.id, .ref, .size_in_bytes] | @tsv' \
            | while IFS=$'\t' read -r id ref size; do
              if [[ "$ref" != "refs/heads/main" ]]; then
                echo "Deleting cache $id (ref: $ref, size: $((size / 1024 / 1024)) MB)"
                gh api -X DELETE "repos/${{ github.repository }}/actions/caches/$id" || true
              fi
            done
          echo "Cache cleanup finished."

  # ─────────────────────────────────────────────
  # 2. Build de las imágenes Docker
  # ─────────────────────────────────────────────
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: cleanup-cache # Opcional: si quieres que espere al cleanup
    outputs:
      frontend-tar: portfolio_frontend.tar
      backend-tar: portfolio_backend.tar

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: portfolio_frontend:latest
          outputs: type=docker,dest=/tmp/portfolio_frontend.tar
          build-args: |
            VITE_TURNSTILE_SITE_KEY=${{ secrets.VITE_TURNSTILE_SITE_KEY }}
            VITE_API_URL=https://wallydev.dev/api/v1

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: portfolio_backend:latest
          outputs: type=docker,dest=/tmp/portfolio_backend.tar

      - name: Upload Frontend Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-image
          path: /tmp/portfolio_frontend.tar
          retention-days: 1

      - name: Upload Backend Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-image
          path: /tmp/portfolio_backend.tar
          retention-days: 1

  # ─────────────────────────────────────────────
  # 3. Preparar y transferir archivos al VPS
  # ─────────────────────────────────────────────
  transfer:
    name: Transfer Files to VPS
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repo (solo para docker-compose)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            docker-compose.prod.yml
          sparse-checkout-cone: false

      - name: Download Frontend Image
        uses: actions/download-artifact@v4
        with:
          name: frontend-image
          path: /tmp

      - name: Download Backend Image
        uses: actions/download-artifact@v4
        with:
          name: backend-image
          path: /tmp

      - name: Prepare staging folder
        run: |
          mkdir -p staging
          cp /tmp/portfolio_frontend.tar staging/
          cp /tmp/portfolio_backend.tar staging/
          cp docker-compose.prod.yml staging/docker-compose.yml

      - name: Copy Files to VPS
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "staging/*"
          target: "${{ secrets.VPS_APP_PATH }}/"
          strip_components: 1

  # ─────────────────────────────────────────────
  # 4. Deploy final en el VPS
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy on VPS
    runs-on: ubuntu-latest
    needs: transfer
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e

            # Setup Directory
            mkdir -p "${{ secrets.VPS_APP_PATH }}"
            cd "${{ secrets.VPS_APP_PATH }}"

            # Create .env file for production
            echo "Creating .env file..."
            cat > .env <<EOF
            POSTGRES_SERVER=vps-postgres
            POSTGRES_USER=${{ secrets.DB_USER }}
            POSTGRES_PASSWORD=${{ secrets.DB_PASSWORD }}
            POSTGRES_DB=portfolio
            BACKEND_CORS_ORIGINS=["https://wallydev.dev"]
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            ADMIN_USERNAME=${{ secrets.ADMIN_USERNAME }}
            ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
            MINIO_ROOT_USER=${{ secrets.MINIO_ROOT_USER }}
            MINIO_ROOT_PASSWORD=${{ secrets.MINIO_ROOT_PASSWORD }}
            MINIO_PUBLIC_URL=${{ secrets.MINIO_PUBLIC_URL }}
            SMTP_HOST=${{ secrets.SMTP_HOST }}
            SMTP_PORT=${{ secrets.SMTP_PORT }}
            SMTP_USER=${{ secrets.SMTP_USER }}
            SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
            SMTP_FROM=${{ secrets.SMTP_FROM }}
            CONTACT_TO_EMAIL=${{ secrets.CONTACT_TO_EMAIL }}
            TURNSTILE_SECRET_KEY=${{ secrets.TURNSTILE_SECRET_KEY }}
            EOF

            # Load Images
            echo "Loading images..."
            docker load -i portfolio_frontend.tar
            docker load -i portfolio_backend.tar

            # Cleanup Tars
            rm -f portfolio_frontend.tar portfolio_backend.tar

            # Restart Services
            echo "Restarting stack..."
            docker rm -f portfolio_frontend portfolio_backend || true
            docker compose down
            docker compose up -d

            # Maintenance
            docker image prune -f

            echo "Full Stack Deployment Successful! 🚀"
