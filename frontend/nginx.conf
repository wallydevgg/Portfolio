server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Redirigir llamadas a la API al contenedor backend
    location /api/ {
        proxy_pass http://portfolio_backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Servir archivos de MinIO (imágenes, CV) bajo /storage/
    # MINIO_PUBLIC_URL=https://wallydev.dev/storage -> minio path /<bucket>/<key>
    location /storage/ {
        proxy_pass http://vps-minio:9000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}